; PlatformIO projektas (framework = espidf). Tas pats kodas kompiliuojasi ir su `idf.py build`.
[platformio]
src_dir = main

[env:esp32-s3-n16r8]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.embed_txtfiles = components/net/www/index.html
board_build.embed_files = components/net/www/index.html.gz
extra_scripts = pre:gz_page.py
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

build_flags =
    -D PANEL_PIN_R1=4
    -D PANEL_PIN_G1=5
    -D PANEL_PIN_B1=6
    -D PANEL_PIN_R2=7
    -D PANEL_PIN_G2=8
    -D PANEL_PIN_B2=9
    -D PANEL_PIN_A=1
    -D PANEL_PIN_B=2
    -D PANEL_PIN_C=41
    -D PANEL_PIN_D=42
    -D PANEL_PIN_E=10     ; tik 128×64 (1/32 skenavimo) panelei; 64×32 – nejungiamas
    -D PANEL_PIN_LAT=40
    -D PANEL_PIN_OE=39
    -D PANEL_PIN_CLK=14
    -D PANEL_PIN_SPARE=47 ; laisvas GPIO, prie nieko nejungiamas

; FlightWall stiliaus variantas: tas pats kodas, tik naudojamas
; sdkconfig.esp32-s3-n16r8-fw su CONFIG_SKY_FLIGHTWALL=y (skrydžio kortelė su aviakompanijos logotipu)
[env:esp32-s3-n16r8-fw]
extends = env:esp32-s3-n16r8
